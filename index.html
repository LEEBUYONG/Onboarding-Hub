<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AX교육팀 상시 온보딩 허브 (초안)</title>
<style>
/* ---------- 디자인 토큰 ---------- */
:root{
  --bg:#f6f7f9; --surface:#ffffff; --surface-2:#f0f2f5; --border:#e3e6ea;
  --text:#15171a; --muted:#5f6670; --faint:#9aa1aa;
  --brand:#e8344e; --brand-weak:#fdecef; --brand-text:#c81f39;
  --ok:#1f9d55; --ok-weak:#e6f6ec; --warn:#b7791f; --warn-weak:#fff6e0; --lock:#8a919b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px rgba(0,0,0,.05);
  --radius:14px; --radius-s:9px;
  --font:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1114; --surface:#181b20; --surface-2:#20242b; --border:#2b3038;
    --text:#eef0f3; --muted:#a7afb9; --faint:#6b7380;
    --brand:#ff5a71; --brand-weak:#3a1a21; --brand-text:#ff8294;
    --ok:#3dcc7a; --ok-weak:#163322; --warn:#e2a93b; --warn-weak:#3a2e12; --lock:#6b7380;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#181b20; --surface-2:#20242b; --border:#2b3038;
  --text:#eef0f3; --muted:#a7afb9; --faint:#6b7380;
  --brand:#ff5a71; --brand-weak:#3a1a21; --brand-text:#ff8294;
  --ok:#3dcc7a; --ok-weak:#163322; --warn:#e2a93b; --warn-weak:#3a2e12; --lock:#6b7380;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
}

/* ---------- 기본 ---------- */
*{box-sizing:border-box}
html{color-scheme:light}
@media (prefers-color-scheme: dark){ html:not([data-theme="light"]){color-scheme:dark} }
html[data-theme="dark"]{color-scheme:dark}
html,body{margin:0;padding:0}
button,summary,details,.step,.quick,.check{color:var(--text)}
/* 문서 체크 행 */
.doc{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.doc.read{background:var(--ok-weak);border-color:var(--ok)}
.doc .t{flex:1;min-width:0}
.doc .t b{display:block;font-size:14px}
.doc .t span{font-size:12px;color:var(--muted)}
.doc label{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap}
.doc input{width:18px;height:18px;accent-color:var(--ok)}
.qlist{list-style:none;padding:0;margin:0}
.qlist li{padding:8px 0;border-top:1px solid var(--border);font-size:14px}
.qlist li:first-child{border-top:0}
.qlist .ans{color:var(--ok);font-weight:700}
.qlist .ch{color:var(--muted);font-size:13px;margin:2px 0 0 12px}
body{background:var(--bg);color:var(--text);font-family:var(--font);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:var(--brand-text);text-decoration:none}
a:hover{text-decoration:underline}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{margin:0;line-height:1.3;letter-spacing:-.01em}
h1{font-size:26px;font-weight:800}
h2{font-size:20px;font-weight:700}
h3{font-size:16px;font-weight:700}
p{margin:0}
ul{margin:0;padding-left:18px}
li{margin:4px 0}
.muted{color:var(--muted)}
.faint{color:var(--faint)}
.small{font-size:13px}
.xs{font-size:12px}
.mt-1{margin-top:6px}.mt-2{margin-top:12px}.mt-3{margin-top:18px}.mt-4{margin-top:26px}.mt-5{margin-top:36px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1}
.hidden{display:none!important}

/* ---------- 레이아웃 ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.topbar-in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{font-weight:800;font-size:15px;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo .dot{width:10px;height:10px;border-radius:50%;background:var(--brand);display:inline-block}
.logo .draft{font-size:11px;font-weight:700;color:var(--warn);background:var(--warn-weak);padding:2px 7px;border-radius:999px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav a{padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px}
nav a:hover{background:var(--surface-2);text-decoration:none}
nav a.active{color:var(--text);background:var(--surface-2)}
nav a .badge{margin-left:5px}
.tools{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
main{max-width:1040px;margin:0 auto;padding:22px 16px 80px}
footer{max-width:1040px;margin:0 auto;padding:0 16px 40px;color:var(--faint);font-size:12px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.grid{display:grid;gap:14px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr}}

/* ---------- 버튼·배지·입력 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:10px 16px;border-radius:10px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:14px;transition:.15s;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{filter:brightness(.95)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.lg{padding:14px 22px;font-size:16px;border-radius:12px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.badge{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:700;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-weak);color:var(--ok)}
.badge.brand{background:var(--brand-weak);color:var(--brand-text)}
.badge.warn{background:var(--warn-weak);color:var(--warn)}
.badge.lock{background:var(--surface-2);color:var(--lock)}
.tbd{display:inline-flex;align-items:center;gap:4px;padding:1px 7px;border-radius:999px;font-size:11px;font-weight:700;background:var(--warn-weak);color:var(--warn);border:1px dashed var(--warn);vertical-align:middle}
label.f{display:block;font-weight:700;font-size:13px;margin-bottom:6px;color:var(--muted)}
input[type=text],input[type=date],select,textarea{width:100%;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface);color:var(--text);font:inherit;font-size:15px}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.seg{display:grid;gap:8px;grid-template-columns:repeat(3,1fr)}
.seg.two{grid-template-columns:repeat(2,1fr)}
.seg label{border:1px solid var(--border);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface);display:block}
.seg label:has(input:checked){border-color:var(--brand);background:var(--brand-weak)}
.seg input{display:none}
.seg b{display:block;font-size:14px}
.seg span{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.check{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--border);border-radius:10px;cursor:pointer;background:var(--surface)}
.check:has(input:checked){background:var(--ok-weak);border-color:var(--ok)}
.check input{width:18px;height:18px;margin-top:3px;accent-color:var(--ok);flex:none}
.check.readonly{cursor:default}

/* ---------- 진행률 ---------- */
.progress{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.progress > i{display:block;height:100%;background:var(--brand);border-radius:999px;transition:width .4s ease}
.progress.ok > i{background:var(--ok)}

/* ---------- 파트 카드 ---------- */
.part{display:flex;gap:14px;align-items:flex-start;padding:16px 18px;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface);transition:.2s;position:relative}
.part.clickable{cursor:pointer}
.part.clickable:hover{border-color:var(--brand);transform:translateY(-1px)}
.part.locked{opacity:.62}
.part .num{flex:none;width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px;background:var(--surface-2);color:var(--muted)}
.part.done .num{background:var(--ok-weak);color:var(--ok)}
.part.current .num{background:var(--brand-weak);color:var(--brand-text)}
.part .steps{display:flex;gap:4px;margin-top:8px}
.part .steps i{width:22px;height:5px;border-radius:3px;background:var(--surface-2)}
.part .steps i.on{background:var(--ok)}
.part.unlock-anim{animation:unlock .9s ease}
@keyframes unlock{0%{box-shadow:0 0 0 0 rgba(232,52,78,.5)}70%{box-shadow:0 0 0 14px rgba(232,52,78,0)}100%{box-shadow:none}}

/* ---------- 스텝퍼 ---------- */
.stepper{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.step{padding:12px;border:1px solid var(--border);border-radius:12px;background:var(--surface);display:flex;gap:10px;align-items:center;cursor:pointer}
.step .ic{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:800;background:var(--surface-2);color:var(--muted);flex:none}
.step.done .ic{background:var(--ok);color:#fff}
.step.active{border-color:var(--brand);background:var(--brand-weak)}
.step.active .ic{background:var(--brand);color:#fff}
.step.disabled{opacity:.5;cursor:not-allowed}
.step b{display:block;font-size:14px}
.step span{font-size:12px;color:var(--muted);display:block}
@media (max-width:640px){.stepper{grid-template-columns:1fr}}

/* ---------- 영상 ---------- */
.video{aspect-ratio:16/9;border-radius:12px;background:linear-gradient(135deg,var(--surface-2),var(--border));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--muted);text-align:center;padding:16px;border:1px dashed var(--border)}
.video .play{width:56px;height:56px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:22px;box-shadow:var(--shadow)}

/* ---------- 퀴즈 ---------- */
.choice{display:block;width:100%;text-align:left;padding:14px 16px;border:1px solid var(--border);border-radius:12px;background:var(--surface);color:var(--text);margin-top:8px;font-size:15px;font-weight:600;transition:.15s}
.choice:hover{border-color:var(--brand)}
.choice.correct{background:var(--ok-weak);border-color:var(--ok)}
.choice.wrong{background:var(--brand-weak);border-color:var(--brand)}
.choice:disabled{cursor:default;opacity:.9}
.explain{border-left:4px solid var(--brand);padding:12px 14px;background:var(--brand-weak);border-radius:8px}
.explain.good{border-color:var(--ok);background:var(--ok-weak)}
.pass{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border-radius:999px;background:var(--ok-weak);color:var(--ok);font-weight:800}

/* ---------- 기타 ---------- */
.banner{border:1px solid var(--brand);background:var(--brand-weak);border-radius:12px;padding:12px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.banner.warn{border-color:var(--warn);background:var(--warn-weak)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:12px 18px;border-radius:12px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:50;max-width:calc(100vw - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:700}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:var(--surface-2)}
.tablewrap{overflow-x:auto}
.timeline{list-style:none;padding:0;margin:0;border-left:2px solid var(--border);margin-left:8px}
.timeline li{position:relative;padding:4px 0 10px 18px;margin:0}
.timeline li::before{content:"";position:absolute;left:-7px;top:11px;width:10px;height:10px;border-radius:50%;background:var(--ok);border:2px solid var(--surface)}
.timeline li.pending::before{background:var(--border)}
details{border:1px solid var(--border);border-radius:10px;padding:0 14px;background:var(--surface)}
details+details{margin-top:8px}
summary{padding:12px 0;font-weight:700;cursor:pointer;list-style:none;display:flex;justify-content:space-between;gap:10px}
summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"−"}
details .body{padding:0 0 14px;color:var(--muted)}
.quick{display:flex;flex-direction:column;gap:4px;padding:14px;border:1px solid var(--border);border-radius:12px;background:var(--surface)}
.quick b{font-size:14px}
.quick span{font-size:12px;color:var(--muted)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px;flex-wrap:wrap}
.tabs button{padding:10px 14px;border:0;background:none;color:var(--muted);font-weight:700;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs button.active{color:var(--text);border-bottom-color:var(--brand)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv dt{color:var(--muted);margin:0}
.kv dd{margin:0}
.lockbox{border:1px dashed var(--border);border-radius:12px;padding:14px;background:var(--surface-2);display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.dev{border:1px dashed var(--faint);border-radius:10px;padding:10px 12px;font-size:12px;color:var(--faint);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
</style>
</head>

/* =====================================================================
   STORE — 상태 접근은 전부 이 객체를 통해서만. 실서비스에서는 get/set 내부를
   서버 저장(Railway 앱)으로 교체한다. localStorage 는 쓰지 않는다.
   ===================================================================== */
function freshState(){
  return { member:null, progress:{}, quizRuns:{}, acks:{}, log:[], onboarded_at:null, finalAt:null, justUnlocked:null };
}
const store = (() => {
  let state = freshState();
  return {
    get: () => state,
    set: (patch) => { Object.assign(state, patch); render(); },
    update: (fn) => { fn(state); render(); },
    reset: () => { state = freshState(); render(); },
    load: (obj) => { state = Object.assign(freshState(), obj); render(); },
    snapshot: () => JSON.parse(JSON.stringify(state)),
  };
})();

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const nowIso = () => new Date().toISOString();
const todayStr = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
function fmt(iso){ if(!iso) return ""; const d=new Date(iso); return `${d.getFullYear()}.${pad(d.getMonth()+1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function tbd(label){ return `<span class="tbd">확정 예정${label?` · ${esc(label)}`:""}</span>`; }
function withTbd(text){ return esc(text).replace(/\{\{([A-Z_\.0-9]+)\}\}/g, (_,k)=>tbd(k)); }
function partByCode(code){ return PARTS.find(p=>p.code===code); }
function quizOf(code){ return QUIZ.filter(q=>q.part===code); }
let toastTimer;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2600); }
function log(event, part){ store.get().log.push({ at:nowIso(), event, part:part||null }); }

/* ---------- 트랙·진행·잠금 ---------- */
function buildTrack(role, settle){
  const codes = ["P0","P1","P2","P3"];
  if(role==="instructor") codes.push("P4-A");
  else if(role==="tutor") codes.push("P4-B");
  else codes.push("P4-B","P4-A");            // 겸임: 보조강사 파트 먼저
  codes.push(settle==="freelancer" ? "P5-A" : "P5-B");
  codes.push("P6");
  return codes;
}
function track(){ const m=store.get().member; return m ? buildTrack(m.role, m.settle) : []; }
function prog(code){
  const s=store.get();
  if(!s.progress[code]){
    const p=partByCode(code);
    s.progress[code] = { video:null, doc:null, quiz:null, checks:(p.checklist||[]).map(()=>false), checklist:null, docRead:(p.docs||[]).map(()=>false) };
  }
  const pr=s.progress[code];
  if(!pr.docRead) pr.docRead=(partByCode(code).docs||[]).map(()=>!!pr.doc);   // 이전 버전 진행상황 파일 호환
  return pr;
}
function stepsDone(code){
  if(code==="P6") return store.get().finalAt ? 1 : 0;
  const p=prog(code); return ["video","doc","quiz","checklist"].filter(k=>p[k]).length;
}
function stepsTotal(code){ return code==="P6" ? 1 : 4; }
function partDone(code){ return stepsDone(code)===stepsTotal(code); }
function isUnlocked(code){
  const t=track(); const i=t.indexOf(code);
  if(i<0) return false; if(i===0) return true;
  return partDone(t[i-1]);
}
function allPartsDone(){ return track().filter(c=>c!=="P6").every(partDone); }
function overall(){
  const t=track(); const total=t.reduce((n,c)=>n+stepsTotal(c),0); const done=t.reduce((n,c)=>n+stepsDone(c),0);
  return { done, total, pct: total ? Math.round(done/total*100) : 0 };
}
function estMinutes(){ const n=track().length-1; return [n*15, n*20]; }
function completePart(code){
  // 파트 완료 후 다음 파트 언락 처리 (애니메이션용 표시)
  const t=track(); const next=t[t.indexOf(code)+1];
  if(next){ store.get().justUnlocked=next; }
  toast(`${partByCode(code).title} 파트를 완료했습니다. 다음 파트가 열렸습니다.`);
}

/* ---------- 변경 숙지(ack) ---------- */
function audienceMatch(aud, role){
  if(aud==="all"||aud==="existing") return true;
  if(aud==="new") return false;
  if(aud==="instructor") return role==="instructor"||role==="both";
  if(aud==="tutor") return role==="tutor"||role==="both";
  return false;
}
function allAckItems(){ return ACK_ITEMS.concat(store.get().adminAcks||[]); }
function visibleAcks(){
  const s=store.get(); if(!s.member||!s.onboarded_at) return [];
  const since=s.onboarded_at.slice(0,10), today=todayStr();
  return allAckItems().filter(a => audienceMatch(a.audience, s.member.role) && a.publish_from>since && a.publish_from<=today && (!a.publish_until||a.publish_until>=today));
}
function pendingAcks(){ const s=store.get(); return visibleAcks().filter(a=>!s.acks[a.id]); }
function blockedByAck(){ return pendingAcks().some(a=>a.severity==="required"); }

/* ---------- 라우터 ---------- */
window.addEventListener("hashchange", render);
function go(hash){ if(location.hash===hash) render(); else location.hash=hash; }
function route(){ const h=(location.hash||"#").slice(1); const [name,arg]=h.split("/"); return { name:name||"", arg: arg ? decodeURIComponent(arg) : "" }; }

function render(){
  const s=store.get(); const r=route();
  renderNav(r);
  const app=document.getElementById("app");
  if(r.name==="admin"){ app.innerHTML=viewAdmin(r.arg); bindAdmin(); return; }
  if(!s.member){ app.innerHTML=viewStart(); bindStart(); return; }
  switch(r.name){
    case "part": {
      const code=r.arg;
      if(!track().includes(code)) { toast("내 트랙에 없는 파트입니다."); return go("#home"); }
      if(!isUnlocked(code)) { toast("이전 파트를 완료하면 열립니다."); return go("#home"); }
      if(blockedByAck()) { toast("필수 변경사항을 먼저 확인해 주세요."); return go("#changes"); }
      if(code==="P6") return go("#final");
      app.innerHTML=viewPart(code); bindPart(code); break;
    }
    case "quiz": {
      const code=r.arg;
      if(!isUnlocked(code)||!prog(code).doc) { toast("문서 숙지 단계를 먼저 완료해 주세요."); return go(isUnlocked(code)?`#part/${code}`:"#home"); }
      app.innerHTML=viewQuiz(code); bindQuiz(code); break;
    }
    case "final":
      if(!isUnlocked("P6")) { toast("모든 파트를 완료하면 열립니다."); return go("#home"); }
      app.innerHTML=viewFinal(); bindFinal(); break;
    case "done":
      if(!s.finalAt) return go("#home");
      app.innerHTML=viewDone(); break;
    case "changes":
      if(!s.onboarded_at) return go("#home");
      app.innerHTML=viewChanges(); bindChanges(); break;
    default:
      app.innerHTML=viewHome(); bindHome();
  }
  window.scrollTo({top:0});
}

/* ---------- 공통 상단 ---------- */
function renderNav(r){
  const s=store.get(); const nav=document.getElementById("nav"); const tools=document.getElementById("tools");
  const pend=pendingAcks().length;
  const links=[];
  if(s.member){
    links.push(`<a href="#home" class="${r.name===""||r.name==="home"||r.name==="part"||r.name==="quiz"?"active":""}">내 트랙</a>`);
    if(s.onboarded_at) links.push(`<a href="#changes" class="${r.name==="changes"?"active":""}">변경사항${pend?`<span class="badge brand">${pend}</span>`:""}</a>`);
  }
  links.push(`<a href="#admin" class="${r.name==="admin"?"active":""}">어드민 <span class="badge xs">목업</span></a>`);
  nav.innerHTML=links.join("");
  tools.innerHTML = `
    ${s.member?`<span class="badge">${esc(s.member.name)} · ${ROLE_LABEL[s.member.role]} · ${SETTLE_LABEL[s.member.settle]}</span>`:""}
    <button class="btn sm ghost" id="btn-export" title="진행상황을 파일로 저장">내보내기</button>
    <label class="btn sm ghost" title="저장한 진행상황 파일 불러오기">불러오기<input type="file" id="inp-import" accept="application/json" class="hidden"></label>
    <button class="btn sm ghost" id="btn-theme" title="화면 모드 전환">◐</button>
    ${s.member?`<button class="btn sm ghost" id="btn-reset" title="처음부터 다시">초기화</button>`:""}`;
  document.getElementById("btn-export").onclick=exportState;
  document.getElementById("inp-import").onchange=importState;
  document.getElementById("btn-theme").onclick=()=>{
    const root=document.documentElement; const cur=root.getAttribute("data-theme");
    const dark = cur ? cur==="dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.setAttribute("data-theme", dark?"light":"dark");
  };
  const rs=document.getElementById("btn-reset"); if(rs) rs.onclick=()=>{ if(confirm("진행상황을 모두 지우고 처음부터 시작할까요?")){ store.reset(); go("#home"); } };
}
function exportState(){
  const blob=new Blob([JSON.stringify(store.snapshot(),null,2)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=`onboarding-progress-${todayStr()}.json`; a.click(); URL.revokeObjectURL(a.href);
  toast("진행상황을 내보냈습니다.");
}
function importState(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{ store.load(JSON.parse(rd.result)); toast("진행상황을 불러왔습니다."); go("#home"); }catch{ toast("파일을 읽을 수 없습니다."); } };
  rd.readAsText(f); e.target.value="";
}

function bindStart(){
  document.getElementById("form-start").onsubmit=(e)=>{
    e.preventDefault(); const fd=new FormData(e.target);
    const name=(fd.get("name")||"").toString().trim(); if(!name) return;
    const existing=fd.get("existing")==="on";
    store.update(s=>{
      s.member={ name, role:fd.get("role"), settle:fd.get("settle"), issued_at:nowIso() };
      s.log.push({ at:nowIso(), event:"링크 발급(초안: 트랙 생성)", part:null });
      if(existing){
        // 체험용: 모든 파트 완료 + 9월 1일 온보딩 완료 상태
        const t=buildTrack(s.member.role, s.member.settle); const past="2026-09-01T10:00:00.000Z";
        t.filter(c=>c!=="P6").forEach(c=>{ const p=partByCode(c); s.progress[c]={video:past,doc:past,quiz:past,checks:(p.checklist||[]).map(()=>true),checklist:past}; });
        s.finalAt=past; s.onboarded_at=past;
      }
    });
    go("#home");
  };
}

  const pend=pendingAcks(); const req=pend.filter(a=>a.severity==="required");
  const current=t.find(c=>isUnlocked(c)&&!partDone(c));
  const cards=t.map((code,i)=>{
    const p=partByCode(code); const done=partDone(code); const open=isUnlocked(code);
    const cls=["part", done?"done":"", open&&!done?"current":"", !open?"locked":"", open?"clickable":"", s.justUnlocked===code?"unlock-anim":""].join(" ");
    const steps = code==="P6" ? "" : `<div class="steps">${["video","doc","quiz","checklist"].map(k=>`<i class="${prog(code)[k]?"on":""}" title="${STEP_NAMES[k]}"></i>`).join("")}</div>`;
    const status = done ? `<span class="badge ok">완료 ✓ ${fmt(code==="P6"?s.finalAt:prog(code).checklist)}</span>`
                 : open ? `<span class="badge brand">진행중 · ${stepsDone(code)}/${stepsTotal(code)}단계</span>`

function bindPart(code){
  const p=partByCode(code);

    el.onclick=()=>{ if(el.classList.contains("disabled")) return toast("이전 단계를 먼저 완료해 주세요."); store.update(s=>{ s.viewStep={code, step:el.dataset.step}; }); };
  });
  const bv=document.getElementById("btn-video"); if(bv) bv.onclick=()=>store.update(s=>{ prog(code).video=nowIso(); s.viewStep=null; log("영상 시청 완료",code); toast("영상 시청이 기록되었습니다."); });
  const bd=document.getElementById("btn-doc"); if(bd) bd.onclick=()=>{ if(!prog(code).docRead.every(Boolean)) return toast("원본 문서를 모두 읽고 체크해 주세요."); store.update(s=>{ prog(code).doc=nowIso(); s.viewStep=null; log("문서 숙지",code); toast("문서 숙지가 기록되었습니다."); }); };
  document.querySelectorAll("input[data-doc]:not(:disabled)").forEach(inp=>{
    inp.onchange=()=>store.update(s=>{ const pr=prog(code); pr.docRead[+inp.dataset.doc]=inp.checked; s.viewStep={code, step:"doc"}; if(inp.checked) s.log.push({at:nowIso(), event:`문서 읽음: ${p.docs[+inp.dataset.doc]}`, part:code}); });
  });
  document.querySelectorAll("a[data-docopen]").forEach(a=>{ a.onclick=()=>{ store.get().log.push({at:nowIso(), event:`문서 열람: ${p.docs[+a.dataset.docopen]}`, part:code}); }; });
  const bq=document.getElementById("btn-quiz")||document.getElementById("btn-quiz-again"); if(bq) bq.onclick=()=>{ startQuiz(code); go(`#quiz/${code}`); };
  document.querySelectorAll(".check input:not(:disabled)").forEach(inp=>{

    });
  });
  document.getElementById("btn-dev-complete").onclick=()=>store.update(s=>{
    const pr=prog(code); const ts=nowIso();
    pr.video=pr.video||ts; pr.docRead=pr.docRead.map(()=>true); pr.doc=pr.doc||ts; pr.quiz=pr.quiz||ts; pr.checks=pr.checks.map(()=>true); pr.checklist=pr.checklist||ts; s.viewStep=null;
    log("(리뷰용) 파트 즉시 완료",code); completePart(code);
  });
}

function startQuiz(code){
  const qs=shuffle(quizOf(code).map(q=>q.id));
  store.get().quizRuns[code]={ order:qs, idx:0, choiceOrder:null, picked:null, wrongCount:0, passed:false };
  log("퀴즈 시작",code);
}
function currentQ(code){
  const run=store.get().quizRuns[code]; const q=QUIZ.find(x=>x.id===run.order[run.idx]);
  if(!run.choiceOrder){ run.choiceOrder = q.type==="ox" ? [0,1] : shuffle(q.choices.map((_,i)=>i)); }
  return q;
}
function viewQuiz(code){
  const p=partByCode(code); const run=store.get().quizRuns[code];
  if(!run) { startQuiz(code); }
  const r=store.get().quizRuns[code];
  if(r.passed){
    return `<div class="card" style="text-align:center;max-width:560px;margin:0 auto">
      <div style="font-size:52px">🏅</div>
      <h1 class="mt-2">퀴즈 통과</h1>
      <p class="muted mt-2">${esc(p.title)} 파트의 ${quizOf(code).length}문항을 모두 맞히셨습니다.${r.wrongCount?` (오답 후 재응시 ${r.wrongCount}회)`:""}</p>
      <div class="row mt-4" style="justify-content:center"><a class="btn primary lg" href="#part/${code}">체크리스트로 이동</a></div>
    </div>`;
  }
  const q=currentQ(code); const total=r.order.length;
  const picked=r.picked; const answered=picked!==null;
  const choices=r.choiceOrder.map(ci=>{
    const cls = answered ? (ci===q.answer?"correct":(ci===picked?"wrong":"")) : "";
    return `<button class="choice ${cls}" data-ci="${ci}" ${answered?"disabled":""}>${esc(q.choices[ci])}</button>`;
  }).join("");
  const correct=answered&&picked===q.answer;
  return `
  <div class="row between"><a href="#part/${code}" class="small">← ${esc(p.title)}</a><span class="small muted">문항 ${r.idx+1} / ${total}</span></div>
  <div class="progress mt-2"><i style="width:${Math.round(r.idx/total*100)}%"></i></div>
  <div class="card mt-3" style="max-width:720px;margin-left:auto;margin-right:auto">
    <span class="badge">${q.type==="ox"?"O / X":"4지선다"}</span>
    <h2 class="mt-2">${esc(q.q)}</h2>
    <div class="mt-3">${choices}</div>
    ${answered?`<div class="explain mt-3 ${correct?"good":""}">
        <b>${correct?"정답입니다.":"오답입니다."}</b>
        <p class="mt-1">${esc(q.explain)}</p>
        <p class="xs mt-1 muted">근거: ${esc(q.source)}</p>
      </div>
      <div class="row mt-3">${correct?`<button class="btn primary" id="btn-next">${r.idx+1<total?"다음 문항":"결과 보기"}</button>`:`<button class="btn primary" id="btn-retry">다시 풀기</button>`}</div>`:""}
  </div>`;
}
function bindQuiz(code){
  const run=store.get().quizRuns[code];
  document.querySelectorAll(".choice:not(:disabled)").forEach(b=>{
    b.onclick=()=>store.update(s=>{
      const q=currentQ(code); run.picked=+b.dataset.ci;
      const ok=run.picked===q.answer; if(!ok) run.wrongCount++;
      s.log.push({ at:nowIso(), event:`퀴즈 ${q.id} ${ok?"정답":"오답"}`, part:code });
    });
  });
  const nx=document.getElementById("btn-next"); if(nx) nx.onclick=()=>store.update(s=>{
    run.idx++; run.picked=null; run.choiceOrder=null;
    if(run.idx>=run.order.length){ run.passed=true; if(!prog(code).quiz){ prog(code).quiz=nowIso(); log("퀴즈 통과",code); } }
  });
  const rt=document.getElementById("btn-retry"); if(rt) rt.onclick=()=>store.update(()=>{ run.picked=null; run.choiceOrder=null; });  // 같은 문항 재출제(보기 재셔플)
}

        <dt>계약 기준일</dt><dd>완료일 기준으로 정해집니다. ${tbd("CONTRACT_CUTOFF")}</dd>
      </dl>
    </div>
    <h3 class="mt-4" style="text-align:left">다음 할 일</h3>
    <ol class="mt-2 small" style="text-align:left">
      <li><b>계약서 대기</b> — 담당 매니저가 계약서를 발송합니다. Slack과 포털 알림을 확인해 주세요.</li>
      <li><b>공고 지원</b> — 강사 포털의 교육 공고에서 일정이 맞는 교육에 지원하실 수 있습니다. 발주서는 포털에서 확인합니다.</li>
      <li><b>포털 정보 최신 유지</b> — 교육 가능 일정·연락처·정산 정보가 바뀌면 바로 갱신해 주세요.</li>
    </ol>
    <div class="row mt-4" style="justify-content:center"><a class="btn primary" href="#home">내 트랙으로</a><a class="btn" href="#changes">변경사항 보기</a></div>
  </div>`;
}

/* =====================================================================
   S6 변경사항 (기존 회원용 변경 숙지)
   ===================================================================== */
function viewChanges(){
  const s=store.get(); const items=visibleAcks();
  const render1 = a => {
    const done=s.acks[a.id]; const opened=(s.ackOpened||{})[a.id];
    return `<div class="card ${a.severity==="required"&&!done?"":"flat"}" style="${a.severity==="required"&&!done?"border-color:var(--brand)":""}">
      <div class="row between">
        <div class="row"><span class="badge ${a.severity==="required"?"brand":""}">${a.severity==="required"?"필수":"일반"}</span><span class="badge">${a.audience==="all"||a.audience==="existing"?"전원":a.audience==="instructor"?"강사":"보조강사"}</span><span class="xs muted">게시 ${esc(a.publish_from)}</span></div>
        ${done?`<span class="badge ok">확인 완료 ${fmt(done)}</span>`:""}
      </div>
      <h3 class="mt-2">${esc(a.title)}</h3>
      <ul class="small mt-2">${a.summary.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>
      <div class="row mt-3">
        <a class="btn sm" href="${esc((DOCS[a.doc]||{}).url||"#")}" ${(DOCS[a.doc]||{}).url?'target="_blank" rel="noopener"':""} data-open="${a.id}">원본 문서: ${esc(a.doc)} ↗</a>
        ${done?"":`<button class="btn sm primary" data-ack="${a.id}" ${a.severity==="required"&&!opened?"disabled title='원본 문서를 먼저 열어 주세요'":""}>확인했습니다</button>`}
        ${a.severity==="required"&&!done&&!opened?`<span class="xs muted">필수 항목은 원본 문서를 연 뒤 확인할 수 있습니다.</span>`:""}
      </div>
    </div>`;
  };
  const pend=items.filter(a=>!s.acks[a.id]); const done=items.filter(a=>s.acks[a.id]);
  return `
  <div class="card">
    <span class="badge brand">변경사항</span>
    <h1 class="mt-2">운영 문서 변경 숙지</h1>
    <p class="muted mt-2">온보딩 완료일(${fmt(s.onboarded_at)}) 이후에 게시된 변경사항만 표시됩니다. 「확인했습니다」를 누르면 확인 일시가 기록됩니다. 필수 항목은 확인 전까지 파트 진입이 막힙니다.</p>
  </div>
  <h2 class="mt-4">미확인 ${pend.length}건</h2>
  <div class="grid mt-2">${pend.length?pend.map(render1).join(""):`<div class="card flat muted small">확인할 변경사항이 없습니다.</div>`}</div>
  ${done.length?`<h2 class="mt-4">확인 완료 ${done.length}건</h2><div class="grid mt-2">${done.map(render1).join("")}</div>`:""}
  <p class="xs faint mt-3">2단계에서는 같은 항목이 교무실(강사 플랫폼) 로그인 시 팝업으로도 표시될 예정입니다. 일반 변경은 주 1회 묶음 게시, 필수 변경만 즉시 게시합니다.</p>`;
}
function bindChanges(){
  document.querySelectorAll("[data-open]").forEach(a=>a.onclick=(e)=>{ if(a.getAttribute("href")==="#") e.preventDefault(); store.update(s=>{ s.ackOpened=s.ackOpened||{}; s.ackOpened[a.dataset.open]=true; }); toast("원본 문서 열람이 기록되었습니다."); });
  document.querySelectorAll("[data-ack]").forEach(b=>b.onclick=()=>store.update(s=>{ s.acks[b.dataset.ack]=nowIso(); s.log.push({at:nowIso(), event:`변경사항 확인 ${b.dataset.ack}`, part:null}); toast("확인이 기록되었습니다."); }));
}

/* =====================================================================
   A1 어드민 목업 · A2 변경 숙지 관리 목업
   ===================================================================== */
function dummyTimeline(m){
  const t=buildTrack(m.role,m.settle); const items=[{at:`${m.issued} 10:00`, label:"링크 발급"}];
  const totalSteps=t.filter(c=>c!=="P6").length*4; let left=Math.round(totalSteps*m.progress);
  const base=new Date(m.issued+"T11:00:00");
  for(const c of t){ if(c==="P6") break; for(const k of ["video","doc","quiz","checklist"]){ if(left<=0) return items.concat([{pending:true,label:`${c} ${STEP_NAMES[k]} (대기)`}]); base.setMinutes(base.getMinutes()+7); items.push({at:fmt(base.toISOString()), label:`${c} ${STEP_NAMES[k]}`}); left--; } }
  if(m.done) items.push({at:`${m.done} 16:20`, label:"온보딩 최종 완료 (플랫폼 기록)"});
  return items;
}
function viewAdmin(tab){
  tab=tab||"members"; const s=store.get();
  const me = s.member ? [{ name:`${s.member.name} (이 세션)`, role:s.member.role, settle:s.member.settle, issued:s.member.issued_at.slice(0,10), done:s.finalAt?s.finalAt.slice(0,10):null, progress:overall().pct/100, last:s.log.length?fmt(s.log[s.log.length-1].at):"-", live:true }] : [];
  const rows=me.concat(DUMMY_MEMBERS);
  const sel = s.adminSel ?? 0;
  const m=rows[sel]; const dIssued = r => Math.max(0, Math.round((new Date(todayStr())-new Date(r.issued))/86400000));
  const members=`
    <div class="grid" style="grid-template-columns:1.4fr 1fr;gap:14px" id="admin-grid">
      <div class="card">
        <div class="row between"><h3>인원 현황</h3><div class="row"><button class="btn sm" onclick="return false" title="목업">링크 발급</button><button class="btn sm" onclick="return false" title="목업">미완료자 리마인드 대상 추출</button></div></div>
        <div class="tablewrap mt-2"><table>
          <tr><th>이름</th><th>역할</th><th>정산</th><th>진행률</th><th>완료일</th><th>마지막 활동</th><th>리마인드</th></tr>
          ${rows.map((r,i)=>`<tr class="clickable ${i===sel?"sel":""}" data-i="${i}" style="${i===sel?"background:var(--surface-2)":""}">
            <td><b>${esc(r.name)}</b></td><td>${ROLE_LABEL[r.role]}</td><td>${SETTLE_LABEL[r.settle]}</td>
            <td><div class="progress" style="width:80px;height:7px"><i style="width:${Math.round(r.progress*100)}%"></i></div><span class="xs muted">${Math.round(r.progress*100)}%</span></td>
            <td>${r.done?`<span class="badge ok">${esc(r.done)}</span>`:`<span class="badge lock">미완료</span>`}</td>
            <td class="small muted">${esc(r.last)}</td>
            <td>${!r.done&&dIssued(r)>=7?`<span class="badge brand">D+7</span>`:!r.done&&dIssued(r)>=3?`<span class="badge warn">D+3</span>`:"-"}</td>
          </tr>`).join("")}
        </table></div>
      </div>
      <div class="card">
        <h3>${esc(m.name)} · 단계별 타임라인</h3>
        <p class="xs muted mt-1">${ROLE_LABEL[m.role]} · ${SETTLE_LABEL[m.settle]} · 발급 ${esc(m.issued)}</p>
        <ul class="timeline mt-3 small">
          ${m.live ? (s.log.length?s.log.map(l=>`<li><span class="muted xs">${fmt(l.at)}</span><br>${esc(l.event)}${l.part?` <span class="badge xs">${esc(l.part)}</span>`:""}</li>`).join(""):`<li class="pending">아직 활동이 없습니다.</li>`)
                   : dummyTimeline(m).map(x=>`<li class="${x.pending?"pending":""}">${x.at?`<span class="muted xs">${esc(x.at)}</span><br>`:""}${esc(x.label)}</li>`).join("")}
        </ul>
      </div>
    </div>
    <div class="card flat mt-3">
      <h3>퀴즈 문항 관리 <span class="badge xs">목업</span></h3>
      <p class="small muted mt-1">문항 ${QUIZ.length}개 · 파트 ${PARTS.length}개. 실서비스에서는 문항 풀(JSON)을 이 화면에서 수정하고 챕터문제.md와 동기화합니다. 파트를 펼치면 전체 문항·보기·정답·해설을 볼 수 있습니다.</p>
      <div class="mt-2">
        ${PARTS.filter(p=>p.code!=="P6").map(p=>{ const qs=quizOf(p.code); return `<details><summary><span>${esc(p.code)} ${esc(p.title)}</span><span class="badge">${qs.length}문항 · 4지선다 ${qs.filter(q=>q.type==="mc").length} · OX ${qs.filter(q=>q.type==="ox").length}</span></summary><div class="body"><ul class="qlist">${qs.map(q=>`<li><b>${esc(q.id)}</b> ${esc(q.q)}${q.choices.map((c,i)=>`<div class="ch">${i===q.answer?`<span class="ans">✓ ${esc(c)}</span>`:esc(c)}</div>`).join("")}<div class="ch">해설: ${esc(q.explain)} <span class="faint">· 근거: ${esc(q.source)}</span></div></li>`).join("")}</ul></div></details>`; }).join("")}
      </div>
    </div>`;
  const acks=allAckItems();
  const ackTab=`
    <div class="grid" style="grid-template-columns:1fr 1.3fr;gap:14px" id="admin-grid">
      <div class="card">
        <h3>숙지 항목 등록</h3>
        <form id="form-ack" class="mt-2">
          <label class="f">제목</label><input type="text" name="title" required placeholder="예: 경비 안내 문구 정리">
          <label class="f mt-2">변경 요약 (한 줄에 하나, 3줄)</label><textarea name="summary" required placeholder="무엇이 바뀌었는지&#10;언제부터 적용되는지&#10;무엇을 하면 되는지"></textarea>
          <label class="f mt-2">원본 문서명</label><input type="text" name="doc" required placeholder="예: 팀스파르타 강사 플레이북">
          <div class="grid grid-2 mt-2">
            <div><label class="f">대상</label><select name="audience"><option value="all">전체</option><option value="existing">기존 회원</option><option value="instructor">강사만</option><option value="tutor">보조강사만</option></select></div>
            <div><label class="f">중요도</label><select name="severity"><option value="normal">일반 (나중에 보기 가능)</option><option value="required">필수 (확인 전 진행 차단)</option></select></div>
            <div><label class="f">게시 시작</label><input type="date" name="from" value="${todayStr()}"></div>
            <div><label class="f">게시 종료</label><input type="date" name="until"></div>
          </div>
          <button class="btn primary mt-3" type="submit">즉시 게시</button>
          <p class="xs faint mt-2">초안에서는 메모리에만 저장됩니다. 신규 온보딩 파트를 추가하면 "대상 전체 · 필수" 항목을 자동 생성하는 옵션이 실서비스에 들어갑니다.</p>
        </form>
      </div>
      <div class="card">
        <h3>항목별 확인 현황</h3>
        <div class="tablewrap mt-2"><table>
          <tr><th>제목</th><th>대상</th><th>중요도</th><th>게시</th><th>확인률</th></tr>
          ${acks.map((a,i)=>{ const base=[[12,20],[9,14]][i]||[0,0]; const mine=store.get().acks[a.id]?1:0; const vis=visibleAcks().some(v=>v.id===a.id)?1:0; const n=base[0]+mine, d=base[1]+vis; return `<tr><td><b>${esc(a.title)}</b><br><span class="xs muted">${esc(a.doc)}</span></td><td>${a.audience==="all"?"전체":a.audience==="existing"?"기존":a.audience==="instructor"?"강사":"보조강사"}</td><td>${a.severity==="required"?`<span class="badge brand">필수</span>`:`<span class="badge">일반</span>`}</td><td class="xs muted">${esc(a.publish_from)}${a.publish_until?`<br>~ ${esc(a.publish_until)}`:""}</td><td><b>${d?Math.round(n/d*100):0}%</b> <span class="xs muted">${n}/${d}</span><br><a href="#" onclick="return false" class="xs">미확인자 추출</a></td></tr>`; }).join("")}
        </table></div>
        <div class="banner warn mt-3 small"><b>2단계</b> 같은 항목을 교무실(강사 플랫폼) 로그인 시 팝업으로 확장합니다. 차단 범위(전체 메인 vs 배정·공고 메뉴만)는 플랫폼 협의 후 확정합니다. ${tbd("ACK_POPUP_SCOPE")}</div>
      </div>
    </div>`;
  return `
  <div class="banner warn small"><b>어드민 목업</b><span>실서비스에서는 개인 계정 로그인과 권한 체계가 적용됩니다. 이 화면은 구조 확인용이며 로그인 폼을 흉내 내지 않습니다.</span></div>
  <div class="row between mt-3"><h1>어드민</h1><span class="xs muted">AX교육팀 전용</span></div>
  <div class="tabs mt-3"><button class="${tab==="members"?"active":""}" data-tab="members">인원·진행 현황 (A1)</button><button class="${tab==="ack"?"active":""}" data-tab="ack">변경 숙지 관리 (A2)</button></div>
  ${tab==="ack"?ackTab:members}
  <style>@media (max-width:860px){#admin-grid{grid-template-columns:1fr!important}}</style>`;
}
function bindAdmin(){
  document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>go(`#admin/${b.dataset.tab}`));
  document.querySelectorAll("tr.clickable").forEach(tr=>tr.onclick=()=>store.update(s=>{ s.adminSel=+tr.dataset.i; }));
  const f=document.getElementById("form-ack"); if(f) f.onsubmit=(e)=>{
    e.preventDefault(); const fd=new FormData(f);
    const item={ id:`ack-${Date.now()}`, title:fd.get("title"), severity:fd.get("severity"), audience:fd.get("audience"), summary:String(fd.get("summary")).split("\n").map(x=>x.trim()).filter(Boolean).slice(0,3), doc:fd.get("doc"), publish_from:fd.get("from")||todayStr(), publish_until:fd.get("until")||"" };
    store.update(s=>{ s.adminAcks=s.adminAcks||[]; s.adminAcks.push(item); });
    toast("숙지 항목을 게시했습니다. (메모리 저장)");
  };
}

/* ---------- 시작 ---------- */
render();
</script>
</body>
</html>
